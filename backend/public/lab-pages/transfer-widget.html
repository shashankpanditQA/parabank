<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Transfer Widget</title>
  <link rel="stylesheet" href="/lab-pages/lab.css" />
  <style> body { background: #fffbeb; } main { padding: 14px; } </style>
</head>
<body>
<main>
  <h2>Quick Transfer Widget</h2>
  <p class="muted small">Frame name: <code>bank-payment-frame</code></p>
  <form id="widget-form" novalidate>
    <label for="w-name">Beneficiary Name</label>
    <input id="w-name" />
    <label for="w-account">Account Number</label>
    <input id="w-account" inputmode="numeric" />
    <div class="row">
      <div><label for="w-amount">Amount</label><input id="w-amount" type="number" min="1" step="0.01" /></div>
      <div>
        <label for="w-speed">Speed</label>
        <select id="w-speed"><option value="standard">Standard (1-2 days)</option><option value="instant">Instant</option><option value="wire">Wire</option></select>
      </div>
    </div>
    <fieldset style="border:0;padding:0;margin:10px 0 0">
      <legend style="font-weight:600;font-size:13px">Fee paid by</legend>
      <label style="font-weight:400;display:inline"><input type="radio" name="fee" value="sender" checked style="width:auto" /> Sender</label>
      <label style="font-weight:400;display:inline;margin-left:12px"><input type="radio" name="fee" value="receiver" style="width:auto" /> Receiver</label>
    </fieldset>
    <div class="actions"><button class="primary" type="submit">Send Money</button></div>
  </form>
  <div id="widget-result" role="status"></div>
</main>
<script>
  document.getElementById('widget-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('w-name').value.trim();
    const acct = document.getElementById('w-account').value.trim();
    const amount = Number(document.getElementById('w-amount').value);
    const out = document.getElementById('widget-result');
    if (!name || !/^\d{8,17}$/.test(acct) || !(amount > 0)) {
      out.innerHTML = '<div class="alert danger">Please enter a name, an 8-17 digit account number and a positive amount.</div>';
      return;
    }
    const speed = document.getElementById('w-speed').value;
    const fee = document.querySelector('input[name="fee"]:checked').value;
    const ref = 'QTR-' + Math.floor(100000 + Math.random() * 900000);
    out.innerHTML = '<div class="alert success"><span data-testid="widget-confirmation"></span></div>';
    out.querySelector('[data-testid="widget-confirmation"]').textContent =
      'Transfer ' + ref + ' queued: $' + amount.toFixed(2) + ' to ' + name + ' (' + speed + ', fee paid by ' + fee + ')';
  });
</script>
</body>
</html>
